<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0B0F17" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05080E" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="15%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes sweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(950px); }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
    }
    .sweep-bar {
      animation: sweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .live-dot {
      animation: pulseLed 2s ease-in-out infinite;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: url(#nameGrad);
    }
    .tag-text {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #00F0FF;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }
    .meta-text {
      font-family: 'SF Mono', 'Fira Code', Menlo, monospace;
      font-size: 11px;
      fill: #64748B;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#dotGrid)"/>
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#accentGlow)"/>
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#purpleGlow)"/>

  <!-- Border Shell -->
  <rect x="2" y="2" width="896" height="236" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.6"/>

  <!-- Top Laser Scanner Line -->
  <g clip-path="url(#bannerClip)">
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="896" height="236" rx="12"/>
    </clipPath>
    <rect x="0" y="2" width="280" height="2" fill="url(#laserBeam)" class="sweep-bar"/>
  </g>

  <!-- Minimal Corner Brackets -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.8"/>
  <path d="M 886 30 L 886 14 L 870 14" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.8"/>
  <path d="M 14 210 L 14 226 L 30 226" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.8"/>
  <path d="M 886 210 L 886 226 L 870 226" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.8"/>

  <!-- Top Pill / Status Indicator -->
  <rect x="42" y="26" width="300" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="56" cy="38" r="4" fill="#10B981" class="live-dot"/>
  <text x="68" y="42" class="tag-text">SYSTEM ACTIVE // MADHACKER912</text>

  <!-- Top Right Status -->
  <text x="858" y="42" text-anchor="end" class="meta-text" fill="#10B981">● READY TO COLLABORATE</text>

  <!-- Main Headline Name (y=100) -->
  <text x="42" y="100" class="hero-title">SAKSHAM GUPTA</text>

  <!-- Role Subtitle (y=132) -->
  <text x="44" y="132" class="sub-text">
    <tspan fill="#38BDF8" font-weight="600">Full-Stack Systems Architect</tspan>
    <tspan fill="#475569">  |  </tspan>
    <tspan fill="#F1F5F9">CyberSecurity Researcher</tspan>
    <tspan fill="#475569">  |  </tspan>
    <tspan fill="#A855F7">Autonomous AI Builder</tspan>
  </text>

  <!-- Divider Line (y=154) -->
  <line x1="42" y1="154" x2="858" y2="154" stroke="#1E293B" stroke-width="1"/>
  <line x1="42" y1="154" x2="160" y2="154" stroke="#00F0FF" stroke-width="1.5" opacity="0.8"/>

  <!-- Row 1: Focus Specs (y=180) -->
  <text x="44" y="180" class="meta-text">
    <tspan fill="#00F0FF" font-weight="600">FOCUS:</tspan> Autonomous Browser Agents • AST Vulnerability Research • Linux Systems
  </text>

  <!-- Row 2: Arsenal & Live Portfolio (y=206) -->
  <text x="44" y="206" class="meta-text">
    <tspan fill="#A855F7" font-weight="600">ARSENAL:</tspan> Rust • Python • TypeScript • C/C++ • Flutter
  </text>
  <text x="858" y="206" text-anchor="end" class="meta-text">
    <tspan fill="#10B981" font-weight="600">PORTFOLIO:</tspan> <tspan fill="#38BDF8">sakshamgupta.online</tspan>
  </text>
</svg>
