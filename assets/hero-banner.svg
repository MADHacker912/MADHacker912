<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0B0F17" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06090E" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="20%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    @keyframes sweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(950px); }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
    }
    @keyframes subtleDrift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .sweep-bar {
      animation: sweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .live-dot {
      animation: pulseLed 2s ease-in-out infinite;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: url(#nameGrad);
    }
    .tag-text {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #00F0FF;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 1px;
      fill: #94A3B8;
    }
    .meta-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      fill: #64748B;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="216" rx="12" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="896" height="216" rx="12" fill="url(#dotGrid)"/>
  <rect x="2" y="2" width="896" height="216" rx="12" fill="url(#accentGlow)"/>
  <rect x="2" y="2" width="896" height="216" rx="12" fill="url(#purpleGlow)"/>

  <!-- Border Shell -->
  <rect x="2" y="2" width="896" height="216" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.6"/>

  <!-- Top Laser Scanner Line -->
  <g clip-path="url(#bannerClip)">
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="896" height="216" rx="12"/>
    </clipPath>
    <rect x="0" y="2" width="280" height="2" fill="url(#laserBeam)" class="sweep-bar"/>
  </g>

  <!-- Minimal Corner Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.8"/>
  <path d="M 888 28 L 888 12 L 872 12" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.8"/>
  <path d="M 12 192 L 12 208 L 28 208" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.8"/>
  <path d="M 888 192 L 888 208 L 872 208" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.8"/>

  <!-- Top Pill / Status Indicator -->
  <rect x="42" y="32" width="310" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="56" cy="44" r="4" fill="#10B981" class="live-dot"/>
  <text x="68" y="48" class="tag-text">SYSTEM ACTIVE // MADHACKER912</text>

  <!-- Top Right Terminal Coordinates -->
  <text x="858" y="48" text-anchor="end" class="meta-text">LOC: IN // NODE: PRIMARY</text>

  <!-- Main Headline Name -->
  <text x="42" y="106" class="hero-title">SAKSHAM GUPTA</text>

  <!-- Monogram Watermark Background -->
  <text x="858" y="148" text-anchor="end" font-family="-apple-system, sans-serif" font-size="78" font-weight="900" fill="#1E293B" opacity="0.25" letter-spacing="4px">0xSG</text>

  <!-- Role Subtitle -->
  <text x="44" y="138" class="sub-text">
    <tspan fill="#38BDF8" font-weight="600">Full-Stack Systems Architect</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#F1F5F9">CyberSecurity Researcher</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#8B5CF6">Autonomous AI Builder</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="42" y1="162" x2="858" y2="162" stroke="#1E293B" stroke-width="1"/>
  <line x1="42" y1="162" x2="160" y2="162" stroke="#00F0FF" stroke-width="1.5" opacity="0.9"/>

  <!-- Bottom Metadata Specs -->
  <text x="44" y="188" class="meta-text">
    <tspan fill="#00F0FF">ARSENAL:</tspan> RUST • PYTHON • TYPESCRIPT • C/C++ • CHROMIUM DAEMONS • AST PARSERS
  </text>
  <text x="858" y="188" text-anchor="end" class="meta-text">
    <tspan fill="#10B981">PORTFOLIO:</tspan> sakshamgupta.online
  </text>
</svg>
