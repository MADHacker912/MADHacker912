<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="170">
  <defs>
    <radialGradient id="pBoardBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#06090E"/>
    </radialGradient>
    <pattern id="pGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
    <filter id="pShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes cMoveA {
      0%, 100% { transform: translate(190px, 45px); }
      50% { transform: translate(220px, 60px); }
    }
    @keyframes cMoveB {
      0%, 100% { transform: translate(630px, 50px); }
      50% { transform: translate(600px, 35px); }
    }
    @keyframes cMoveC {
      0%, 100% { transform: translate(410px, 120px); }
      50% { transform: translate(450px, 105px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -16; }
    }
    @keyframes pulseGuide {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .cur-a { animation: cMoveA 5.5s ease-in-out infinite; }
    .cur-b { animation: cMoveB 6s ease-in-out infinite; }
    .cur-c { animation: cMoveC 5s ease-in-out infinite; }
    .marching-outline { stroke-dasharray: 4, 4; animation: dashMove 0.8s linear infinite; }
    .guide-p { animation: pulseGuide 2s ease-in-out infinite; }

    .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #FFFFFF; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <!-- Base Canvas -->
  <rect x="2" y="2" width="916" height="166" rx="10" fill="url(#pBoardBg)"/>
  <rect x="2" y="2" width="916" height="166" rx="10" fill="url(#pGrid)"/>
  <rect x="2" y="2" width="916" height="166" rx="10" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Canvas Header Rail -->
  <rect x="2" y="2" width="916" height="26" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <circle cx="20" cy="15" r="3.5" fill="#0ACF83"/>
  <text x="32" y="18" class="mono" font-size="10" font-weight="700" fill="#00F0FF">SWARM SCHEMATIC // REPOSITORY WIREFRAMES</text>
  <text x="890" y="18" text-anchor="end" class="mono" font-size="9" fill="#94A3B8">COLLABORATIVE ASSEMBLY ACTIVE</text>

  <!-- Component Card 1: agent-live-browser (Being Dragged by Linus) -->
  <g transform="translate(30, 42)">
    <rect x="0" y="0" width="200" height="105" rx="6" fill="#0F172A" stroke="#0D99FF" stroke-width="1.4" class="marching-outline"/>
    <!-- Transform Nodes -->
    <rect x="-3" y="-3" width="6" height="6" fill="#FFF" stroke="#0D99FF" stroke-width="1"/>
    <rect x="197" y="-3" width="6" height="6" fill="#FFF" stroke="#0D99FF" stroke-width="1"/>
    <rect x="197" y="102" width="6" height="6" fill="#FFF" stroke="#0D99FF" stroke-width="1"/>
    <rect x="-3" y="102" width="6" height="6" fill="#FFF" stroke="#0D99FF" stroke-width="1"/>
    <!-- Size Chip -->
    <rect x="65" y="-10" width="70" height="15" rx="3" fill="#0D99FF"/>
    <text x="100" y="1" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#FFF">200 × 105 px</text>

    <text x="12" y="24" class="mono" font-size="9" font-weight="bold" fill="#38BDF8">agent-live-browser</text>
    <text x="12" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Sandboxed Chromium</text>
    <text x="12" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Interactive Stream: 7654</text>
    <rect x="12" y="74" width="55" height="16" rx="3" fill="#1E293B"/>
    <text x="20" y="85" class="mono" font-size="8" fill="#0ACF83">Python</text>
  </g>

  <!-- Distance Guide between Card 1 & Card 2 -->
  <line x1="230" y1="94" x2="254" y2="94" stroke="#FF3366" stroke-width="1" stroke-dasharray="2,2" class="guide-p"/>
  <rect x="233" y="85" width="18" height="14" rx="2" fill="#FF3366"/>
  <text x="242" y="95" text-anchor="middle" class="mono" font-size="7" font-weight="bold" fill="#FFF">24</text>

  <!-- Component Card 2: vault-scanner (Being audited by MADHacker) -->
  <g transform="translate(254, 42)">
    <rect x="0" y="0" width="200" height="105" rx="6" fill="#0F172A" stroke="#0ACF83" stroke-width="1.2"/>
    <rect x="65" y="-10" width="70" height="15" rx="3" fill="#0ACF83"/>
    <text x="100" y="1" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#000">200 × 105 px</text>

    <text x="12" y="24" class="mono" font-size="9" font-weight="bold" fill="#0ACF83">vault-scanner</text>
    <text x="12" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Zero-Dependency AST</text>
    <text x="12" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Pre-commit Leaks Audit</text>
    <rect x="12" y="74" width="60" height="16" rx="3" fill="#1E293B"/>
    <text x="20" y="85" class="mono" font-size="8" fill="#38BDF8">AST-Audit</text>
  </g>

  <!-- Distance Guide between Card 2 & Card 3 -->
  <line x1="454" y1="94" x2="478" y2="94" stroke="#FF3366" stroke-width="1" stroke-dasharray="2,2" class="guide-p"/>
  <rect x="457" y="85" width="18" height="14" rx="2" fill="#FF3366"/>
  <text x="466" y="95" text-anchor="middle" class="mono" font-size="7" font-weight="bold" fill="#FFF">24</text>

  <!-- Component Card 3: MJ-X (Being Typed by Ada) -->
  <g transform="translate(478, 42)">
    <rect x="0" y="0" width="200" height="105" rx="6" fill="#0F172A" stroke="#A259FF" stroke-width="1.2"/>
    <rect x="65" y="-10" width="70" height="15" rx="3" fill="#A259FF"/>
    <text x="100" y="1" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#FFF">200 × 105 px</text>

    <text x="12" y="24" class="mono" font-size="9" font-weight="bold" fill="#A259FF">MJ-X</text>
    <text x="12" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Autonomous Desktop AI</text>
    <text x="12" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Task &amp; Shell Orchestration</text>
    <rect x="12" y="74" width="65" height="16" rx="3" fill="#1E293B"/>
    <text x="20" y="85" class="mono" font-size="8" fill="#A259FF">Agent-OS</text>
  </g>

  <!-- Distance Guide between Card 3 & Card 4 -->
  <line x1="678" y1="94" x2="702" y2="94" stroke="#FF3366" stroke-width="1" stroke-dasharray="2,2" class="guide-p"/>
  <rect x="681" y="85" width="18" height="14" rx="2" fill="#FF3366"/>
  <text x="690" y="95" text-anchor="middle" class="mono" font-size="7" font-weight="bold" fill="#FFF">24</text>

  <!-- Component Card 4: PrivChat (Being Linked by Obito) -->
  <g transform="translate(702, 42)">
    <rect x="0" y="0" width="188" height="105" rx="6" fill="#0F172A" stroke="#F24E1E" stroke-width="1.2"/>
    <rect x="59" y="-10" width="70" height="15" rx="3" fill="#F24E1E"/>
    <text x="94" y="1" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#FFF">188 × 105 px</text>

    <text x="12" y="24" class="mono" font-size="9" font-weight="bold" fill="#F24E1E">PrivChat</text>
    <text x="12" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Zero-Knowledge E2EE</text>
    <text x="12" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">WebCrypto Metadata Safe</text>
    <rect x="12" y="74" width="55" height="16" rx="3" fill="#1E293B"/>
    <text x="20" y="85" class="mono" font-size="8" fill="#F24E1E">Privacy</text>
  </g>

  <!-- ANIMATED CURSORS ON SCHEMATIC -->
  <!-- Cursor Linus on Card 1 -->
  <g class="cur-a" filter="url(#pShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#0ACF83" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="16" y="14" width="44" height="16" rx="3" fill="#0ACF83"/>
    <text x="21" y="25" class="tag-font">Linus</text>
  </g>

  <!-- Cursor MADHacker on Card 3 -->
  <g class="cur-b" filter="url(#pShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#0D99FF" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="16" y="14" width="70" height="16" rx="3" fill="#0D99FF"/>
    <text x="21" y="25" class="tag-font">MADHacker</text>
  </g>

  <!-- Cursor Ada on Guide 2 -->
  <g class="cur-c" filter="url(#pShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#A259FF" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="16" y="14" width="36" height="16" rx="3" fill="#A259FF"/>
    <text x="21" y="25" class="tag-font">Ada</text>
  </g>
</svg>
