<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 32" width="100%" height="32">
  <defs>
    <linearGradient id="guideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF3366" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF3366" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FF3366" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes cursorDrift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, -3px); }
    }
    .guide-cursor {
      animation: cursorDrift 3.5s ease-in-out infinite;
    }
    .mono-s {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      font-weight: bold;
    }
  </style>

  <!-- Pink Smart Guide Line -->
  <line x1="40" y1="16" x2="880" y2="16" stroke="url(#guideGrad)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Left Distance Badge -->
  <rect x="220" y="8" width="56" height="16" rx="3" fill="#FF3366"/>
  <text x="248" y="20" text-anchor="middle" class="mono-s" fill="#FFFFFF">← 64px →</text>

  <!-- Center Snapping Crosshair -->
  <circle cx="460" cy="16" r="4" fill="none" stroke="#FF3366" stroke-width="1.5"/>
  <circle cx="460" cy="16" r="1.5" fill="#FFFFFF"/>

  <!-- Right Distance Badge -->
  <rect x="644" y="8" width="56" height="16" rx="3" fill="#FF3366"/>
  <text x="672" y="20" text-anchor="middle" class="mono-s" fill="#FFFFFF">← 64px →</text>

  <!-- Swarm Cursor: Grace (#FF7262 Coral) hovering on center snap -->
  <g class="guide-cursor" transform="translate(465, 4)" filter="url(#shadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#FF7262" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="18" y="14" width="46" height="16" rx="3" fill="#FF7262"/>
    <text x="22" y="26" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Grace</text>
  </g>
</svg>
