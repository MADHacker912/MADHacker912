<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#7928CA" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FF007F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF9C"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(-180px); }
      100% { transform: translateY(180px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00FF9C); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes memPulse {
      0%, 100% { width: 140px; }
      50% { width: 175px; }
    }
    @keyframes cpuPulse {
      0%, 100% { width: 165px; }
      50% { width: 190px; }
    }
    @keyframes barWave1 { 0%, 100% { height: 8px; y: 154px; } 50% { height: 32px; y: 130px; } }
    @keyframes barWave2 { 0%, 100% { height: 28px; y: 134px; } 50% { height: 10px; y: 152px; } }
    @keyframes barWave3 { 0%, 100% { height: 16px; y: 146px; } 50% { height: 38px; y: 124px; } }
    @keyframes barWave4 { 0%, 100% { height: 34px; y: 128px; } 50% { height: 12px; y: 150px; } }

    .scanline {
      animation: scan 3.5s linear infinite;
    }
    .neon-border {
      stroke: url(#cyberGrad);
      stroke-width: 1.5;
    }
    .mono-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #A0B3C6;
    }
    .title-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #00F0FF;
      letter-spacing: 2px;
    }
    .highlight {
      fill: #00FF9C;
      font-weight: 600;
    }
    .accent {
      fill: #FF007F;
      font-weight: 600;
    }
    .status-dot {
      animation: pulse 1.8s ease-in-out infinite;
    }
    .cursor-blink {
      animation: blink 0.9s infinite;
    }
    .mem-bar {
      animation: memPulse 3s ease-in-out infinite;
    }
    .cpu-bar {
      animation: cpuPulse 2.4s ease-in-out infinite;
    }
    .eq-bar-1 { animation: barWave1 1.2s ease-in-out infinite; }
    .eq-bar-2 { animation: barWave2 0.9s ease-in-out infinite; }
    .eq-bar-3 { animation: barWave3 1.4s ease-in-out infinite; }
    .eq-bar-4 { animation: barWave4 1.1s ease-in-out infinite; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="176" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="2" y="2" width="846" height="176" rx="10" fill="none" class="neon-border"/>

  <!-- Scanning Laser Bar -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="4" y="4" width="842" height="172" rx="8"/>
    </clipPath>
    <rect x="4" y="0" width="842" height="36" fill="url(#scanGrad)" class="scanline"/>
  </g>

  <!-- Corner Brackets (Cyber Framing) -->
  <path d="M 6 22 L 6 6 L 22 6" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 844 22 L 844 6 L 828 6" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 6 158 L 6 174 L 22 174" fill="none" stroke="#7928CA" stroke-width="2.5"/>
  <path d="M 844 158 L 844 174 L 828 174" fill="none" stroke="#00FF9C" stroke-width="2.5"/>

  <!-- Status Indicators / Blinking LEDs -->
  <circle cx="28" cy="24" r="5" fill="#00FF9C" class="status-dot"/>
  <circle cx="44" cy="24" r="5" fill="#00F0FF" class="status-dot" style="animation-delay: 0.5s"/>
  <circle cx="60" cy="24" r="5" fill="#FF007F" class="status-dot" style="animation-delay: 1s"/>

  <!-- Header Title -->
  <text x="80" y="29" class="title-text">MADHACKER912 // SYSTEM MAINFRAME HUD v3.8</text>
  <text x="700" y="28" class="mono-text highlight" font-size="11">[ KERNEL: OVERCLOCKED ]</text>

  <!-- Separator Line -->
  <line x1="20" y1="42" x2="830" y2="42" stroke="#21262D" stroke-width="1"/>
  <line x1="20" y1="42" x2="200" y2="42" stroke="#00F0FF" stroke-width="1.8"/>

  <!-- Terminal Info -->
  <text x="30" y="66" class="mono-text">
    <tspan fill="#7928CA">root@mainframe</tspan>:<tspan fill="#00F0FF">~#</tspan> neofetch --security-profile
  </text>
  <text x="30" y="90" class="mono-text">
    <tspan fill="#8B949E">ACTIVE MISSIONS:</tspan> <tspan class="highlight">agent-live-browser</tspan> (Chromium Daemon), <tspan fill="#00F0FF">vault-scanner</tspan> (AST Audit), <tspan class="accent">MJ-X</tspan> (Agent OS)
  </text>
  <text x="30" y="112" class="mono-text">
    <tspan fill="#8B949E">TECH ARSENAL:</tspan> <tspan fill="#F0F6FC">Rust • Python • TypeScript • C/C++ • Kali Linux • Burp Suite • Docker • GSAP</tspan>
  </text>

  <!-- Realtime Telemetry Meters -->
  <text x="30" y="136" class="mono-text">
    <tspan fill="#8B949E">NEURAL RAM:</tspan>
  </text>
  <!-- RAM meter bar -->
  <rect x="130" y="126" width="200" height="10" rx="3" fill="#161B22" stroke="#30363D"/>
  <rect x="130" y="126" width="160" height="10" rx="3" fill="url(#barGrad1)" class="mem-bar"/>
  <text x="340" y="135" class="mono-text" font-size="10" fill="#00FF9C">84.2% ALLOCATED</text>

  <text x="30" y="158" class="mono-text">
    <tspan fill="#8B949E">CORE CPU:</tspan>
  </text>
  <!-- CPU meter bar -->
  <rect x="130" y="148" width="200" height="10" rx="3" fill="#161B22" stroke="#30363D"/>
  <rect x="130" y="148" width="180" height="10" rx="3" fill="url(#barGrad2)" class="cpu-bar"/>
  <text x="340" y="157" class="mono-text" font-size="10" fill="#FF007F">92.8% 5.2GHz BOOST</text>

  <!-- Equalizer Audio / Activity Motion Waves on Right Side -->
  <g fill="url(#cyberGrad)" opacity="0.9">
    <rect x="730" y="130" width="5" height="32" rx="2" class="eq-bar-1"/>
    <rect x="740" y="134" width="5" height="28" rx="2" class="eq-bar-2"/>
    <rect x="750" y="146" width="5" height="16" rx="2" class="eq-bar-3"/>
    <rect x="760" y="128" width="5" height="34" rx="2" class="eq-bar-4"/>
    <rect x="770" y="136" width="5" height="26" rx="2" class="eq-bar-1"/>
    <rect x="780" y="144" width="5" height="18" rx="2" class="eq-bar-3"/>
    <rect x="790" y="130" width="5" height="32" rx="2" class="eq-bar-2"/>
    <rect x="800" y="126" width="5" height="36" rx="2" class="eq-bar-4"/>
    <rect x="810" y="140" width="5" height="22" rx="2" class="eq-bar-1"/>
  </g>
  <text x="730" y="112" class="mono-text" font-size="10" fill="#8B949E">NEURAL FREQ<tspan class="cursor-blink" fill="#00F0FF"> █</tspan></text>
</svg>
