<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(-160px); }
      100% { transform: translateY(160px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes barWave1 { 0%, 100% { height: 6px; y: 130px; } 50% { height: 26px; y: 110px; } }
    @keyframes barWave2 { 0%, 100% { height: 24px; y: 112px; } 50% { height: 8px; y: 128px; } }
    @keyframes barWave3 { 0%, 100% { height: 14px; y: 122px; } 50% { height: 32px; y: 104px; } }
    @keyframes barWave4 { 0%, 100% { height: 28px; y: 108px; } 50% { height: 10px; y: 126px; } }
    @keyframes barWave5 { 0%, 100% { height: 10px; y: 126px; } 50% { height: 22px; y: 114px; } }
    .scanline {
      animation: scan 4s linear infinite;
    }
    .neon-border {
      stroke: url(#cyberGrad);
      stroke-width: 1.5;
    }
    .mono-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #A0B3C6;
    }
    .title-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #00F0FF;
      letter-spacing: 2px;
    }
    .highlight {
      fill: #00FF9C;
      font-weight: 600;
    }
    .accent {
      fill: #FF007F;
    }
    .status-dot {
      animation: pulse 1.8s ease-in-out infinite;
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
    .eq-bar-1 { animation: barWave1 1.2s ease-in-out infinite; }
    .eq-bar-2 { animation: barWave2 0.9s ease-in-out infinite; }
    .eq-bar-3 { animation: barWave3 1.4s ease-in-out infinite; }
    .eq-bar-4 { animation: barWave4 1.1s ease-in-out infinite; }
    .eq-bar-5 { animation: barWave5 1.3s ease-in-out infinite; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="156" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="2" y="2" width="846" height="156" rx="10" fill="none" class="neon-border"/>

  <!-- Scanning Laser Bar -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="4" y="4" width="842" height="152" rx="8"/>
    </clipPath>
    <rect x="4" y="0" width="842" height="30" fill="url(#scanGrad)" class="scanline"/>
  </g>

  <!-- Corner Brackets (Cyber Framing) -->
  <path d="M 6 22 L 6 6 L 22 6" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 844 22 L 844 6 L 828 6" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 6 138 L 6 154 L 22 154" fill="none" stroke="#7928CA" stroke-width="2"/>
  <path d="M 844 138 L 844 154 L 828 154" fill="none" stroke="#FF007F" stroke-width="2"/>

  <!-- Status Indicators / Blinking LEDs -->
  <circle cx="28" cy="24" r="5" fill="#00FF9C" class="status-dot"/>
  <circle cx="44" cy="24" r="5" fill="#00F0FF" class="status-dot" style="animation-delay: 0.5s"/>
  <circle cx="60" cy="24" r="5" fill="#FF007F" class="status-dot" style="animation-delay: 1s"/>

  <!-- Header Title -->
  <text x="80" y="29" class="title-text">MADHACKER912 // NEURAL MAINFRAME HUD</text>
  <text x="730" y="28" class="mono-text highlight" font-size="12">[ ONLINE: 24/7 ]</text>

  <!-- Separator Line -->
  <line x1="20" y1="42" x2="830" y2="42" stroke="#21262D" stroke-width="1"/>
  <line x1="20" y1="42" x2="160" y2="42" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- System Info Grid -->
  <text x="30" y="68" class="mono-text">
    <tspan fill="#7928CA">root@mainframe</tspan>:<tspan fill="#00F0FF">~#</tspan> status --verbose
  </text>
  <text x="30" y="94" class="mono-text">
    <tspan fill="#8B949E">ARCHITECTURE:</tspan> <tspan class="highlight">Full-Stack</tspan> • <tspan fill="#00F0FF">CyberSecurity</tspan> • <tspan fill="#FF79C6">Reverse Engineering</tspan> • <tspan fill="#FFA657">Autonomous AI</tspan>
  </text>
  <text x="30" y="118" class="mono-text">
    <tspan fill="#8B949E">CORE WEAPONS:</tspan> <tspan fill="#F0F6FC">Python, Rust, TypeScript, C/C++, Flutter, Docker, Linux Kernel</tspan>
  </text>
  <text x="30" y="142" class="mono-text">
    <tspan fill="#8B949E">MISSION:</tspan> <tspan class="highlight">Architecting resilient software &amp; autonomous intelligence</tspan><tspan fill="#00F0FF" class="cursor-blink"> █</tspan>
  </text>

  <!-- Equalizer Audio / Activity Motion Waves on Right Side -->
  <g fill="#00F0FF" opacity="0.85">
    <rect x="740" y="110" width="5" height="26" rx="2" class="eq-bar-1"/>
    <rect x="750" y="112" width="5" height="24" rx="2" class="eq-bar-2"/>
    <rect x="760" y="122" width="5" height="14" rx="2" class="eq-bar-3"/>
    <rect x="770" y="108" width="5" height="28" rx="2" class="eq-bar-4"/>
    <rect x="780" y="114" width="5" height="22" rx="2" class="eq-bar-5"/>
    <rect x="790" y="120" width="5" height="16" rx="2" class="eq-bar-2"/>
    <rect x="800" y="106" width="5" height="30" rx="2" class="eq-bar-4"/>
    <rect x="810" y="118" width="5" height="18" rx="2" class="eq-bar-1"/>
  </g>
  <text x="740" y="94" class="mono-text" font-size="10" fill="#8B949E">SIGNAL FLOW</text>
</svg>
