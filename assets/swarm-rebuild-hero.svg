<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="swarmBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="60%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#06090E"/>
    </radialGradient>

    <!-- Dot Grid Pattern (Figma Canvas style) -->
    <pattern id="canvasGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pinkGuide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF3366" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cursor Shadow -->
    <filter id="cursorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Swarm Cursor Floating Animations */
    @keyframes cursor1Move {
      0%, 100% { transform: translate(0, 0); }
      30% { transform: translate(12px, -8px); }
      70% { transform: translate(-6px, 10px); }
    }
    @keyframes cursor2Move {
      0%, 100% { transform: translate(0, 0); }
      40% { transform: translate(-14px, 8px); }
      80% { transform: translate(8px, -12px); }
    }
    @keyframes cursor3Move {
      0%, 100% { transform: translate(0, 0); }
      35% { transform: translate(-10px, -6px); }
      75% { transform: translate(14px, 6px); }
    }
    @keyframes cursor4Move {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-8px, -8px); }
    }
    @keyframes boxMarch {
      to { stroke-dashoffset: -16; }
    }
    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGuide {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .cursor-1 { animation: cursor1Move 5s ease-in-out infinite; }
    .cursor-2 { animation: cursor2Move 6s ease-in-out infinite; }
    .cursor-3 { animation: cursor3Move 4.5s ease-in-out infinite; }
    .cursor-4 { animation: cursor4Move 5.5s ease-in-out infinite; }
    .select-box { stroke-dasharray: 4, 4; animation: boxMarch 1s linear infinite; }
    .caret { animation: caretBlink 0.9s infinite; }
    .guide-pulse { animation: pulseGuide 2.5s ease-in-out infinite; }

    .ruler-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 8px; fill: #64748B; }
    .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #FFFFFF; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="916" height="256" rx="10" fill="url(#swarmBg)"/>
  <rect x="20" y="20" width="896" height="236" fill="url(#canvasGrid)"/>
  <rect x="2" y="2" width="916" height="256" rx="10" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Ruler Rail -->
  <rect x="2" y="2" width="916" height="18" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <!-- Top Ruler Ticks & Numbers -->
  <g stroke="#334155" stroke-width="1">
    <line x1="100" y1="12" x2="100" y2="18"/>
    <line x1="200" y1="12" x2="200" y2="18"/>
    <line x1="300" y1="12" x2="300" y2="18"/>
    <line x1="400" y1="12" x2="400" y2="18"/>
    <line x1="500" y1="12" x2="500" y2="18"/>
    <line x1="600" y1="12" x2="600" y2="18"/>
    <line x1="700" y1="12" x2="700" y2="18"/>
    <line x1="800" y1="12" x2="800" y2="18"/>
    <line x1="900" y1="12" x2="900" y2="18"/>
  </g>
  <text x="102" y="10" class="ruler-text">100</text>
  <text x="202" y="10" class="ruler-text">200</text>
  <text x="302" y="10" class="ruler-text">300</text>
  <text x="402" y="10" class="ruler-text">400</text>
  <text x="502" y="10" class="ruler-text">500</text>
  <text x="602" y="10" class="ruler-text">600</text>
  <text x="702" y="10" class="ruler-text">700</text>
  <text x="802" y="10" class="ruler-text">800</text>

  <!-- Left Ruler Rail -->
  <rect x="2" y="2" width="18" height="256" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <g stroke="#334155" stroke-width="1">
    <line x1="12" y1="60" x2="18" y2="60"/>
    <line x1="12" y1="120" x2="18" y2="120"/>
    <line x1="12" y1="180" x2="18" y2="180"/>
    <line x1="12" y1="240" x2="18" y2="240"/>
  </g>
  <text x="3" y="64" class="ruler-text">60</text>
  <text x="3" y="124" class="ruler-text">120</text>
  <text x="3" y="184" class="ruler-text">180</text>
  <text x="3" y="244" class="ruler-text">240</text>

  <!-- Top-left Ruler Corner Origin Block -->
  <rect x="2" y="2" width="18" height="18" fill="#1E293B"/>

  <!-- Top Canvas Blueprint Status -->
  <rect x="42" y="30" width="230" height="20" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="52" cy="40" r="3.5" fill="#0ACF83"/>
  <text x="62" y="44" class="mono" font-size="10" font-weight="600" fill="#00F0FF">SWARM REBUILD // v2.4</text>
  <text x="200" y="44" class="mono" font-size="9" fill="#94A3B8">[AUTO-SYNC]</text>

  <!-- Active Canvas Guides (Smart Alignment in Pink #FF3366) -->
  <line x1="38" y1="156" x2="890" y2="156" stroke="url(#pinkGuide)" stroke-width="1" stroke-dasharray="3,3" class="guide-pulse"/>
  <!-- Distance Badge on Guide -->
  <rect x="450" y="148" width="46" height="16" rx="3" fill="#FF3366"/>
  <text x="473" y="160" text-anchor="middle" class="mono" font-size="9" font-weight="bold" fill="#FFFFFF">← 16 →</text>

  <!-- SELECTION BOX AROUND NAME (Swarm Drag/Transform Box) -->
  <g>
    <!-- Bounding Outline -->
    <rect x="38" y="64" width="480" height="54" fill="rgba(13, 153, 255, 0.05)" stroke="#0D99FF" stroke-width="1.2" class="select-box"/>
    <!-- 8 Corner & Edge Handles -->
    <rect x="35" y="61" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="275" y="61" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="515" y="61" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="35" y="88" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="515" y="88" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="35" y="115" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="275" y="115" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>
    <rect x="515" y="115" width="6" height="6" fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.2"/>

    <!-- Live Dimension Tooltip Badge -->
    <rect x="245" y="48" width="66" height="16" rx="3" fill="#0D99FF"/>
    <text x="278" y="60" text-anchor="middle" class="mono" font-size="9" font-weight="bold" fill="#FFFFFF">480 × 54</text>
  </g>

  <!-- Primary Headline Name -->
  <text x="50" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="3px" fill="url(#titleGrad)">SAKSHAM GUPTA</text>

  <!-- Wireframe Card Box on Right (Being Built by Swarm) -->
  <g>
    <rect x="580" y="64" width="310" height="74" rx="6" fill="rgba(30, 41, 59, 0.4)" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="592" y="74" width="70" height="14" rx="3" fill="#1E293B"/>
    <text x="596" y="84" class="mono" font-size="8" fill="#38BDF8">ROLE_SPEC</text>
    <text x="592" y="106" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Systems &amp; Offensive Security</text>
    <text x="592" y="124" class="mono" font-size="10" fill="#94A3B8">BUILDING: agent-live-browser</text>
    <!-- Dimension Badge -->
    <rect x="830" y="56" width="56" height="14" rx="2" fill="#334155"/>
    <text x="858" y="66" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">310 × 74</text>
  </g>

  <!-- Subtitle with Typing Caret (y=144) -->
  <text x="50" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">
    <tspan fill="#38BDF8">Full-Stack Systems Architect</tspan>
    <tspan fill="#475569">  •  </tspan>
    <tspan fill="#F1F5F9">CyberSecurity Researcher</tspan>
    <tspan fill="#475569">  •  </tspan>
    <tspan fill="#A259FF">Autonomous AI Builder</tspan>
  </text>
  <!-- Blinking Caret -->
  <line x1="565" y1="132" x2="565" y2="146" stroke="#0D99FF" stroke-width="2" class="caret"/>

  <!-- Row 1: Focus Specs (y=190) -->
  <text x="50" y="190" class="mono" font-size="11" fill="#64748B">
    <tspan fill="#0ACF83" font-weight="600">MISSION:</tspan> Autonomous Browser Agents • AST Vulnerability Research • Linux Systems
  </text>

  <!-- Row 2: Arsenal & Live Portfolio (y=216) -->
  <text x="50" y="216" class="mono" font-size="11" fill="#64748B">
    <tspan fill="#A259FF" font-weight="600">ARSENAL:</tspan> Rust • Python • TypeScript • C/C++ • Chromium Daemons • Playwright
  </text>
  <text x="890" y="216" text-anchor="end" class="mono" font-size="11" fill="#64748B">
    <tspan fill="#0D99FF" font-weight="600">CANVAS:</tspan> <tspan fill="#38BDF8">sakshamgupta.online</tspan>
  </text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!--           SWARM MULTIPLAYER CURSORS (Authentic SVG)          -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- CURSOR 1: MADHacker (#0D99FF Blue) at Selection Handle -->
  <g class="cursor-1" transform="translate(512, 60)" filter="url(#cursorShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#0D99FF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pill Tag -->
    <rect x="18" y="16" width="76" height="18" rx="4" fill="#0D99FF"/>
    <text x="24" y="29" class="tag-font">MADHacker</text>
  </g>

  <!-- CURSOR 2: Linus (#0ACF83 Green) on Wireframe Card -->
  <g class="cursor-2" transform="translate(730, 80)" filter="url(#cursorShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#0ACF83" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="18" y="16" width="46" height="18" rx="4" fill="#0ACF83"/>
    <text x="24" y="29" class="tag-font">Linus</text>
  </g>

  <!-- CURSOR 3: Ada (#A259FF Purple) on Subtitle -->
  <g class="cursor-3" transform="translate(360, 136)" filter="url(#cursorShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#A259FF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="18" y="16" width="38" height="18" rx="4" fill="#A259FF"/>
    <text x="24" y="29" class="tag-font">Ada</text>
  </g>

  <!-- CURSOR 4: Obito (#F24E1E Orange/Red) on Bottom Link -->
  <g class="cursor-4" transform="translate(740, 204)" filter="url(#cursorShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#F24E1E" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="18" y="16" width="44" height="18" rx="4" fill="#F24E1E"/>
    <text x="24" y="29" class="tag-font">Obito</text>
  </g>
</svg>
