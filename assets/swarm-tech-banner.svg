<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120">
  <defs>
    <radialGradient id="tBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#06090E"/>
    </radialGradient>
    <pattern id="tGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
    <filter id="tShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes curT1 {
      0%, 100% { transform: translate(250px, 45px); }
      50% { transform: translate(280px, 35px); }
    }
    @keyframes curT2 {
      0%, 100% { transform: translate(680px, 40px); }
      50% { transform: translate(650px, 55px); }
    }
    .c-t1 { animation: curT1 5s ease-in-out infinite; }
    .c-t2 { animation: curT2 5.5s ease-in-out infinite; }
    .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #FFFFFF; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <!-- Base Canvas -->
  <rect x="2" y="2" width="916" height="116" rx="8" fill="url(#tBg)"/>
  <rect x="2" y="2" width="916" height="116" rx="8" fill="url(#tGrid)"/>
  <rect x="2" y="2" width="916" height="116" rx="8" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Canvas Header Rail -->
  <rect x="2" y="2" width="916" height="24" fill="#0B0F17" stroke="#1E293B" stroke-width="1"/>
  <circle cx="20" cy="14" r="3.5" fill="#38BDF8"/>
  <text x="32" y="17" class="mono" font-size="10" font-weight="700" fill="#00F0FF">SWARM BLUEPRINT // TECH ARSENAL STACK</text>
  <text x="890" y="17" text-anchor="end" class="mono" font-size="9" fill="#94A3B8">GRID ALIGNED: 4 MODULES</text>

  <!-- 4 Blueprint Tooling Modules -->
  <g transform="translate(30, 38)">
    <rect x="0" y="0" width="195" height="68" rx="5" fill="#0F172A" stroke="#FF0055" stroke-width="1.2"/>
    <text x="12" y="22" class="mono" font-size="10" font-weight="bold" fill="#FF0055">01 // CYBER_SECURITY</text>
    <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Kali • Burp • Ghidra • Nmap</text>
    <text x="12" y="56" class="mono" font-size="9" fill="#64748B">STATUS: EXPLOIT_RESEARCH</text>
    <rect x="135" y="-8" width="52" height="14" rx="2" fill="#FF0055"/>
    <text x="161" y="2" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#FFF">195 × 68</text>
  </g>

  <g transform="translate(245, 38)">
    <rect x="0" y="0" width="195" height="68" rx="5" fill="#0F172A" stroke="#0D99FF" stroke-width="1.2"/>
    <text x="12" y="22" class="mono" font-size="10" font-weight="bold" fill="#0D99FF">02 // CORE_SYSTEMS</text>
    <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Rust • Python • TypeScript • C++</text>
    <text x="12" y="56" class="mono" font-size="9" fill="#64748B">STATUS: LOW_LEVEL_ARCH</text>
    <rect x="135" y="-8" width="52" height="14" rx="2" fill="#0D99FF"/>
    <text x="161" y="2" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#FFF">195 × 68</text>
  </g>

  <g transform="translate(460, 38)">
    <rect x="0" y="0" width="195" height="68" rx="5" fill="#0F172A" stroke="#A259FF" stroke-width="1.2"/>
    <text x="12" y="22" class="mono" font-size="10" font-weight="bold" fill="#A259FF">03 // MOTION_&amp;_UI</text>
    <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">React • Next.js • Tailwind • GSAP</text>
    <text x="12" y="56" class="mono" font-size="9" fill="#64748B">STATUS: 60FPS_CRAFT</text>
    <rect x="135" y="-8" width="52" height="14" rx="2" fill="#A259FF"/>
    <text x="161" y="2" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#FFF">195 × 68</text>
  </g>

  <g transform="translate(675, 38)">
    <rect x="0" y="0" width="205" height="68" rx="5" fill="#0F172A" stroke="#0ACF83" stroke-width="1.2"/>
    <text x="12" y="22" class="mono" font-size="10" font-weight="bold" fill="#0ACF83">04 // AI_&amp;_BACKENDS</text>
    <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">FastAPI • Docker • PG • PyTorch</text>
    <text x="12" y="56" class="mono" font-size="9" fill="#64748B">STATUS: NEURAL_SCALE</text>
    <rect x="145" y="-8" width="52" height="14" rx="2" fill="#0ACF83"/>
    <text x="171" y="2" text-anchor="middle" class="mono" font-size="8" font-weight="bold" fill="#000">205 × 68</text>
  </g>

  <!-- Cursors -->
  <g class="c-t1" filter="url(#tShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#0D99FF" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="16" y="14" width="70" height="16" rx="3" fill="#0D99FF"/>
    <text x="21" y="25" class="tag-font">MADHacker</text>
  </g>

  <g class="c-t2" filter="url(#tShadow)">
    <path d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z" fill="#FF7262" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="16" y="14" width="48" height="16" rx="3" fill="#FF7262"/>
    <text x="21" y="25" class="tag-font">Dennis</text>
  </g>
</svg>
